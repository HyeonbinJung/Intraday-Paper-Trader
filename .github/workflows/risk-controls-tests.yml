name: Risk controls regression tests

on:
  push:
    branches: [main]
    paths:
      - 'trader.py'
      - 'tests/**'
      - '.github/workflows/risk-controls-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run regression tests
        run: |
          python -m py_compile trader.py
          python -m unittest discover -s tests -v
